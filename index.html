<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Puff Zone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f0b1a;--card:#1a1428;--card2:#231b36;--txt:#f3eefc;--mut:#a99cc4;--acc:#b56cff;--acc2:#ff5fa2;--line:#2e2446}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:rgba(15,11,26,.94);backdrop-filter:blur(10px);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{display:flex;background:var(--card);border-radius:10px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);font-weight:700;padding:5px 10px;border-radius:8px}
.lang button.on{background:var(--acc);color:#fff}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:7px 14px;border-radius:20px;font-weight:600}
.tabs button.on{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent}
.note{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:var(--card);color:var(--mut);font-size:12.5px}
h3.sec{margin:18px 16px 0;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 0}
.p{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.p .img{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.p .img img{width:100%;height:100%;object-fit:cover}
.p .img.ph{background:radial-gradient(circle at 50% 40%,#b56cff33,transparent 70%),#1f1830;color:var(--mut);flex-direction:column;gap:6px;font-size:12px;text-align:center;padding:10px}
.p .img.ph b{font-size:15px;color:var(--txt);line-height:1.2}
.p .b{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.p .n{font-weight:700;font-size:14px}
.p .s{color:var(--mut);font-size:12px}
.p .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-size:16px}
.add{border:0;background:var(--acc);color:#fff;font-weight:800;border-radius:10px;min-width:36px;height:34px;font-size:18px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{border:0;background:var(--card2);color:var(--txt);width:30px;height:30px;border-radius:9px;font-size:17px;font-weight:800}
.qty span{min-width:16px;text-align:center;font-weight:700}
.soon{margin:12px 16px 0;padding:22px 12px;border-radius:16px;border:1px dashed var(--line);text-align:center;color:var(--mut)}
.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:6;display:none}
.bar button,.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar button{box-shadow:0 8px 24px rgba(181,108,255,.35)}
.btn{margin-top:16px}.btn.gh{background:var(--card2)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;border-top:1px solid var(--line)}
.sheet h2{margin:0 0 12px;font-size:20px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.li .t{font-size:14px}.li .t small{color:var(--mut);display:block}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font:inherit}
.sum{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;color:var(--mut)}
.sum.tot{color:var(--txt);font-weight:800;font-size:18px;margin-top:10px}
.err{color:var(--acc2);font-size:13px;margin-top:8px;min-height:1em}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate .big{font-size:64px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate p{color:var(--mut);max-width:320px}
.gate .btn{max-width:320px}
.done{text-align:center;padding:20px 0}.done .ic{font-size:54px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="logo" style="font-size:30px">PUFF ZONE</div>
  <div class="big">18+</div>
  <p data-t="gateText"></p>
  <button class="btn" onclick="okAge()" data-t="gateYes"></button>
  <button class="btn gh" onclick="noAge()" data-t="gateNo"></button>
</div>

<header>
  <div class="top">
    <div class="logo">PUFF ZONE</div>
    <div class="lang"><button id="l_ru" onclick="setLang('ru')">RU</button><button id="l_ua" onclick="setLang('ua')">UA</button><button id="l_de" onclick="setLang('de')">DE</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="note" data-t="delivNote"></div>
<div id="list"></div>

<div class="bar" id="bar"><button onclick="openCart()" id="barBtn"></button></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeCart()"><div class="in" id="sheetIn"></div></div>

<script>
/* ======================= НАСТРОЙКИ ======================= */
const SHOP = {
  manager: "Puff_Maneger",   // юзернейм, куда приходят заказы
  currency: "€",
  // Ссылка на Google-таблицу «Опубликовать в интернете → CSV».
  // Пока пусто — магазин берёт каталог ниже (DEFAULT).
  sheetCsv: "https://docs.google.com/spreadsheets/d/e/2PACX-1vThuuxDe1slEHt78n_vhBcblz1LEmqUkRccsPQIEUByqLE6jw4mm9E9CS58hqFqWShtocmRR0h9HRQK/pub?output=csv",
  cities: ["Braunschweig", "Braunschweig (Umgebung)", "Magdeburg", "Hannover"]
};

/* ======================= КАТАЛОГ =======================
   Тот же формат, что и в Google-таблице, одна строка = один товар:
   [Раздел, Название, Описание, Цена, Фото (ссылка), Показывать]
   - Раздел можно писать на трёх языках через |  (Устройства|Пристрої|Geräte)
   - Строка только с разделом (без названия) = пустой раздел «Скоро в наличии»
   - Фото: любая прямая ссылка на картинку или ссылка Google Drive
   - Показывать: да / нет                                                   */
const DEFAULT = [
  ["Vozol","Blueberry Ice","10 ml · 20 mg","15","","да"],
  ["Vozol","Cherry Cola","10 ml · 20 mg","15","","да"],
  ["Vozol","Dragon Fruit Banana Cherry","10 ml · 20 mg","15","","да"],
  ["Vozol","Grape Ice","10 ml · 20 mg","15","","да"],
  ["Vozol","Kiwi Passion Fruit Guava","10 ml · 20 mg","15","","да"],
  ["Vozol","Lavafire","10 ml · 20 mg","15","","да"],
  ["Vozol","Love 777","10 ml · 20 mg","15","","да"],
  ["Vozol","Mixed Berries","10 ml · 20 mg","15","","да"],
  ["Vozol","Peach Ice","10 ml · 20 mg","15","","да"],
  ["Vozol","Sour Apple Ice","10 ml · 20 mg","15","","да"],
  ["Vozol","Strawberry Ice","10 ml · 20 mg","15","","да"],
  ["Vozol","Strawberry Kiwi","10 ml · 20 mg","15","","да"],
  ["Vozol","Watermelon Ice","10 ml · 20 mg","15","","да"],
  ["Vozol","Grape Cherry","10 ml · 20 mg","15","","да"],
  ["Vozol","Frozen Grape Soda","10 ml · 20 mg","15","","да"],
  ["ELFLIQ","","","","","да"],
  ["Chaser","","","","","да"],
  ["Устройства|Пристрої|Geräte","Vaporesso XROS 6 Mini","Plume White","30","","да"],
  ["Картриджи|Картриджі|Kartuschen","Vaporesso XROS Cartridge","2 ml · 0.8 Ω","5","","да"]
];

/* ======================= ТЕКСТЫ ======================= */
const T={
 ru:{gateText:"Магазин только для совершеннолетних. Курьер проверит документ при передаче заказа.",gateYes:"Мне есть 18 лет",gateNo:"Мне нет 18",
  noEntry:"Извините, магазин доступен только с 18 лет.",all:"Все",soon:"Скоро в наличии",photo:"фото скоро",
  delivNote:"🚚 Бесплатная доставка курьером: Braunschweig и область, Magdeburg, Hannover. Оплата наличными курьеру.",
  cart:"Корзина",items:"шт",total:"Итого",sub:"Товары",deliv:"Доставка",free:"бесплатно",
  name:"Имя",phone:"Телефон",city:"Город",addr:"Адрес (улица, дом, индекс)",time:"Удобное время",comment:"Комментарий",
  pay:"Оплата: наличными курьеру",send:"Отправить заказ",back:"Назад",
  fill:"Заполни имя, телефон и адрес",doneT:"Почти готово!",doneP:"Откроется чат с менеджером — нажми «Отправить». Текст заказа уже вставлен и скопирован.",
  openChat:"Открыть чат",ageNote:"Подтверждаю, что мне есть 18 лет, и покажу документ курьеру",order:"Заказ"},
 ua:{gateText:"Магазин лише для повнолітніх. Кур'єр перевірить документ під час передачі замовлення.",gateYes:"Мені є 18 років",gateNo:"Мені немає 18",
  noEntry:"Вибачте, магазин доступний лише з 18 років.",all:"Усі",soon:"Незабаром у наявності",photo:"фото незабаром",
  delivNote:"🚚 Безкоштовна доставка кур'єром: Braunschweig та область, Magdeburg, Hannover. Оплата готівкою кур'єру.",
  cart:"Кошик",items:"шт",total:"Разом",sub:"Товари",deliv:"Доставка",free:"безкоштовно",
  name:"Ім'я",phone:"Телефон",city:"Місто",addr:"Адреса (вулиця, будинок, індекс)",time:"Зручний час",comment:"Коментар",
  pay:"Оплата: готівкою кур'єру",send:"Надіслати замовлення",back:"Назад",
  fill:"Заповни ім'я, телефон та адресу",doneT:"Майже готово!",doneP:"Відкриється чат з менеджером — натисни «Надіслати». Текст замовлення вже вставлено й скопійовано.",
  openChat:"Відкрити чат",ageNote:"Підтверджую, що мені є 18 років, і покажу документ кур'єру",order:"Замовлення"},
 de:{gateText:"Shop nur für Erwachsene. Der Kurier prüft bei der Übergabe deinen Ausweis.",gateYes:"Ich bin 18 oder älter",gateNo:"Ich bin unter 18",
  noEntry:"Entschuldigung, der Shop ist erst ab 18 Jahren zugänglich.",all:"Alle",soon:"Bald verfügbar",photo:"Foto folgt",
  delivNote:"🚚 Kostenlose Lieferung per Kurier: Braunschweig und Umgebung, Magdeburg, Hannover. Barzahlung beim Kurier.",
  cart:"Warenkorb",items:"Stk.",total:"Gesamt",sub:"Artikel",deliv:"Lieferung",free:"kostenlos",
  name:"Name",phone:"Telefon",city:"Stadt",addr:"Adresse (Straße, Hausnr., PLZ)",time:"Wunschzeit",comment:"Kommentar",
  pay:"Zahlung: bar beim Kurier",send:"Bestellung senden",back:"Zurück",
  fill:"Bitte Name, Telefon und Adresse ausfüllen",doneT:"Fast geschafft!",doneP:"Der Chat mit dem Manager öffnet sich – tippe auf „Senden“. Der Bestelltext ist bereits eingefügt und kopiert.",
  openChat:"Chat öffnen",ageNote:"Ich bestätige, dass ich mindestens 18 Jahre alt bin, und zeige dem Kurier meinen Ausweis",order:"Bestellung"}
};

/* ======================= ЛОГИКА ======================= */
const tg=window.Telegram&&Telegram.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0f0b1a');tg.setBackgroundColor('#0f0b1a')}catch(e){}}
let lang="ru",sec="all",cart={},SECS=[],PRODUCTS=[],F={name:'',phone:'',addr:'',time:'',comment:'',city:SHOP.cities[0]};
try{lang=localStorage.getItem('pz_lang')||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code==='uk'?'ua':(tg.initDataUnsafe.user.language_code==='de'?'de':'ru'))}catch(e){}
const t=k=>T[lang][k], money=v=>v.toFixed(2).replace('.',',')+" "+SHOP.currency;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const secName=s=>{const p=s.split('|'),i={ru:0,ua:1,de:2}[lang];return (p[i]||p[0]).trim()};

function photoUrl(u){
  u=(u||'').trim(); if(!u) return '';
  const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w600`:u;
}
function build(rows){
  SECS=[];PRODUCTS=[];
  rows.forEach((r,i)=>{
    const [s,n,d,p,ph,show]=r.map(x=>(x||'').trim());
    if(!s||/^(нет|ні|no|0)$/i.test(show)) return;
    if(!SECS.includes(s)) SECS.push(s);
    const price=parseFloat(p.replace(',','.'));
    if(n&&!isNaN(price)) PRODUCTS.push({id:'p'+i,sec:s,name:n,sub:d,price,photo:photoUrl(ph)});
  });
}
function parseCSV(txt){
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c=='"'){if(txt[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);out.push(row);row=[];f=''}else if(c!='\r')f+=c}
  if(f||row.length){row.push(f);out.push(row)}
  return out.slice(1); // первая строка — заголовки
}

function card(p){
  const q=cart[p.id]||0;
  const img=p.photo?`<div class="img"><img src="${esc(p.photo)}" loading="lazy" alt=""></div>`
    :`<div class="img ph"><b>${esc(p.name)}</b>📷 ${t('photo')}</div>`;
  return `<div class="p">${img}<div class="b"><div class="n">${esc(p.name)}</div><div class="s">${esc(p.sub)}</div>
  <div class="row"><div class="price">${money(p.price)}</div>${q?`<div class="qty"><button onclick="chg('${p.id}',-1)">−</button><span>${q}</span><button onclick="chg('${p.id}',1)">+</button></div>`:`<button class="add" onclick="chg('${p.id}',1)">+</button>`}</div></div></div>`;
}
function render(){
  document.documentElement.lang={ru:'ru',ua:'uk',de:'de'}[lang];
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  l_ru.className=lang==='ru'?'on':'';l_ua.className=lang==='ua'?'on':'';l_de.className=lang==='de'?'on':'';
  tabs.innerHTML=[['all',t('all')],...SECS.map((s,i)=>[i,secName(s)])].map(([k,v])=>`<button class="${String(k)===String(sec)?'on':''}" onclick="sec='${k}';render();scrollTo(0,0)">${esc(v)}</button>`).join('');
  const show=sec==='all'?SECS:[SECS[sec]];
  list.innerHTML=show.map(s=>{const ps=PRODUCTS.filter(p=>p.sec===s);
    return `<h3 class="sec">${esc(secName(s))}</h3>`+(ps.length?`<div class="grid">${ps.map(card).join('')}</div>`:`<div class="soon">✨ ${t('soon')}</div>`)}).join('');
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  bar.style.display=n?'block':'none'; barBtn.textContent=`${t('cart')} · ${n} ${t('items')} · ${money(subtotal())}`;
}
function setLang(l){lang=l;try{localStorage.setItem('pz_lang',l)}catch(e){};render();if(sheet.style.display==='flex')openCart()}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];if(tg&&tg.HapticFeedback)tg.HapticFeedback.selectionChanged();render();if(sheet.style.display==='flex'){Object.keys(cart).length?openCart():closeCart()}}
const prod=id=>PRODUCTS.find(p=>p.id===id);
const subtotal=()=>Object.entries(cart).reduce((s,[id,q])=>s+(prod(id)?prod(id).price*q:0),0);

function openCart(){
  const s=subtotal();
  sheetIn.innerHTML=`<h2>${t('cart')}</h2>`+
   Object.entries(cart).map(([id,q])=>{const p=prod(id);return `<div class="li"><div class="t">${esc(p.name)}<small>${esc(secName(p.sec))} · ${esc(p.sub)} · ${money(p.price)}</small></div><div class="qty"><button onclick="chg('${id}',-1)">−</button><span>${q}</span><button onclick="chg('${id}',1)">+</button></div></div>`}).join('')+
   `<label>${t('name')}</label><input value="${esc(F.name)}" oninput="F.name=this.value">
   <label>${t('phone')}</label><input type="tel" value="${esc(F.phone)}" oninput="F.phone=this.value" placeholder="+49 ...">
   <label>${t('city')}</label><select onchange="F.city=this.value">${SHOP.cities.map(c=>`<option ${c===F.city?'selected':''}>${esc(c)}</option>`).join('')}</select>
   <label>${t('addr')}</label><input value="${esc(F.addr)}" oninput="F.addr=this.value">
   <label>${t('time')}</label><input value="${esc(F.time)}" oninput="F.time=this.value" placeholder="18:00–20:00">
   <label>${t('comment')}</label><textarea rows="2" oninput="F.comment=this.value">${esc(F.comment)}</textarea>
   <div class="sum" style="margin-top:14px"><span>${t('sub')}</span><span>${money(s)}</span></div>
   <div class="sum"><span>${t('deliv')}</span><span>${t('free')}</span></div>
   <div class="sum tot"><span>${t('total')}</span><span>${money(s)}</span></div>
   <div class="sum">${t('pay')}</div>
   <label style="display:flex;gap:10px;align-items:flex-start;color:var(--txt)"><input type="checkbox" id="f_age" style="width:auto;margin-top:3px"> ${t('ageNote')}</label>
   <div class="err" id="err"></div>
   <button class="btn" onclick="send()">${t('send')}</button><button class="btn gh" onclick="closeCart()">${t('back')}</button>`;
  sheet.style.display='flex';
}
function closeCart(){sheet.style.display='none'}
function send(){
  const s=subtotal();
  if(!F.name.trim()||!F.phone.trim()||!F.addr.trim()){err.textContent=t('fill');return}
  if(!f_age.checked){err.textContent=t('ageNote');return}
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  const lines=Object.entries(cart).map(([id,q])=>{const p=prod(id);return `• ${secName(p.sec)} ${p.name} (${p.sub}) × ${q} = ${money(p.price*q)}`});
  const txt=`🛒 ${t('order')} Puff Zone\n\n${lines.join('\n')}\n\n${t('total')}: ${money(s)}\n🚚 ${t('deliv')}: ${t('free')}\n💶 ${t('pay')}\n\n👤 ${F.name}\n📞 ${F.phone}\n📍 ${F.city}, ${F.addr}\n🕒 ${F.time||'-'}\n💬 ${F.comment||'-'}${u&&u.username?'\n@'+u.username:''}\n✅ 18+`;
  try{navigator.clipboard.writeText(txt).catch(()=>{})}catch(e){}
  const link=`https://t.me/${SHOP.manager}?text=${encodeURIComponent(txt)}`;
  window._link=link;
  sheetIn.innerHTML=`<div class="done"><div class="ic">✅</div><h2>${t('doneT')}</h2><p style="color:var(--mut)">${t('doneP')}</p>
   <button class="btn" onclick="go(_link)">${t('openChat')}</button></div>`;
  go(link);
}
function go(l){if(tg&&tg.openTelegramLink){tg.openTelegramLink(l)}else{window.open(l,'_blank')}}
function okAge(){gate.style.display='none';try{sessionStorage.setItem('pz18','1')}catch(e){}}
function noAge(){gate.innerHTML=`<div class="logo" style="font-size:30px">PUFF ZONE</div><p>${t('noEntry')}</p>`}
try{if(sessionStorage.getItem('pz18'))gate.style.display='none'}catch(e){}

build(DEFAULT);render();
if(SHOP.sheetCsv){
  fetch(SHOP.sheetCsv+(SHOP.sheetCsv.includes('?')?'&':'?')+'t='+Date.now()).then(r=>r.text())
   .then(txt=>{const rows=parseCSV(txt);if(rows.length){build(rows);if(sec!=='all'&&!SECS[sec])sec='all';render()}}).catch(()=>{});
}
</script>
</body>
</html>
